[app]
name = "App::Moneymoor"      # dist name
exec = "moneymoor"           # launcher/binary name
display = "Moneymoor"

[bundle]
platforms = ["macos-arm64", "linux-x86_64-glibc", "windows-x86_64"]
native = ["notcurses", "sqlcipher"]

# Commands `ariza smoke` runs against a freshly built bundle, each with a
# replaced (env -i style) environment. Every entry is argv, verbatim --
# nothing goes through a shell, so there is no quoting layer to get wrong.
#
# The first proves the launcher starts the app at all. The second proves
# that bundled SQLCipher loads and can create, write, and reopen an encrypted
# database. The third exercises Selkie's error-log setup without initializing
# notcurses, including Raku and the Win32 standard-error view. Those
# are the paths --version never reaches and a superficially healthy bundle
# can still get wrong.
smoke = [
    ["{exec}", "--version"],
    ["{raku}", "-e", '''
use App::Moneymoor::DB;

my $path = @*ARGS[0].IO.add('ariza-smoke.sqlcipher');
$path.unlink if $path.e;

my $db = App::Moneymoor::DB.new(:db-path($path.absolute));
my $opened = $db.connect('ariza-smoke-passphrase');
die "connect failed: " ~ $opened.exception.message if $opened ~~ Failure;
$db.execute('CREATE TABLE ariza_smoke (id INTEGER PRIMARY KEY, note TEXT)');
$db.execute('INSERT INTO ariza_smoke (note) VALUES (?)', 'round-trip');
$db.disconnect;

my $again = App::Moneymoor::DB.new(:db-path($path.absolute));
my $reopened = $again.connect('ariza-smoke-passphrase');
die "reopen failed: " ~ $reopened.exception.message if $reopened ~~ Failure;
my $row = $again.query-one('SELECT note FROM ariza_smoke WHERE id = 1');
die "row did not survive the round trip" unless ($row // {})<note> eq 'round-trip';
$again.disconnect;

say "ok: encrypted database created, written and reopened";
''', "{tmp}"],
    ["{raku}", "-e", '''
use NativeCall;
use Selkie::App::Internal::ErrorLog;
use Selkie::App::Internal::ErrorLogPlatform;

class ErrorLogProbe does Selkie::App::Internal::ErrorLog {
    method install(Str:D $path --> Nil) { self!install-error-log($path) }
    method uninstall(--> Nil) { self!uninstall-error-log }
}

sub posix-write(int32, Str, size_t --> ssize_t)
    is native is symbol('write') { * }
sub windows-write-file(Pointer, Str, uint32, uint32 is rw, Pointer --> int32)
    is native('kernel32') is symbol('WriteFile') { * }

my $path = @*ARGS[0].IO.add('ariza-smoke.error.log');
$path.unlink if $path.e;
my $original-windows-handle = IS-WINDOWS
    ?? windows-get-std-handle(WINDOWS-STD-ERROR-HANDLE)
    !! Pointer;

sub same-windows-handle($left, $right --> Bool:D) {
    $left.defined && $right.defined && $left.Int == $right.Int;
}

my $probe = ErrorLogProbe.new;
$probe.install($path.Str);
if IS-WINDOWS {
    die 'Win32 stderr handle was not replaced'
        if same-windows-handle(
            windows-get-std-handle(WINDOWS-STD-ERROR-HANDLE),
            $original-windows-handle,
        );
}
$*ERR.say('raku-error-log-marker');
$*ERR.flush;
my $native-marker = "native-error-log-marker\n";
if IS-WINDOWS {
    my uint32 $written = 0;
    my $ok = windows-write-file(
        windows-get-std-handle(WINDOWS-STD-ERROR-HANDLE),
        $native-marker,
        $native-marker.encode.bytes,
        $written,
        Pointer,
    );
    die 'native stderr write failed'
        unless $ok && $written == $native-marker.encode.bytes;
}
else {
    my $written = posix-write(2, $native-marker, $native-marker.encode.bytes);
    die 'native stderr write failed'
        unless $written == $native-marker.encode.bytes;
}
$probe.uninstall;

if IS-WINDOWS {
    die 'Win32 stderr handle was not restored'
        unless same-windows-handle(
            windows-get-std-handle(WINDOWS-STD-ERROR-HANDLE),
            $original-windows-handle,
        );
}
my $log = $path.slurp;
die 'Raku stderr did not reach the error log'
    unless $log.contains('raku-error-log-marker');
die 'native stderr did not reach the error log'
    unless $log.contains('native-error-log-marker');

say 'ok: Selkie error log redirected and restored';
''', "{tmp}"],
]

# Where the generated install.sh / install.ps1 fetch releases from, and
# the repository whose raw files the `curl … | sh` one-liner names.
[installer]
repo = "m-doughty/App-Moneymoor"

[updates]
enabled = true

# What the bundle redistributes. Almost all of it is read out of the
# bundle itself -- the notcurses pack's own licensing kit, ariza's record
# of the vendored runtime, and every installed distribution's META6
# `license` field -- so the only rows here are the ones nothing in the
# bundle can answer for.
#
# A distribution whose metadata does not state a licence fails the build
# rather than shipping unattributed, which is why this table exists at
# all: somebody has to go and look, once, and write down what they found.
[licensing]

# NativeLibs (a DBIish dependency) states its licence in its own
# META6.json -- under the key `licence`, which is the British spelling
# and not the META6 `license` key any tool reads, so every consumer sees
# a distribution with no licence at all. The declaration is the author's
# own and unambiguous; only the key is misspelled.
[[licensing.dists]]
name = "NativeLibs"
spdx-license = "Artistic-2.0"
project-url = "https://github.com/salortiz/NativeLibs"
notes = """
Licence from the distribution's own META6.json, which declares
`"licence" : "Artistic-2.0"` -- the British spelling, which is not the
META6 `license` key, so the field is invisible to zef and to ariza. The
repository ships no LICENSE file and its README makes no licensing
statement; the metadata declaration is the author's own. Verified at
https://github.com/salortiz/NativeLibs/blob/master/META6.json (v0.0.9,
the version DBIish depends on). The upstream fix is a one-character key
rename, and this row goes away once it lands.
"""
